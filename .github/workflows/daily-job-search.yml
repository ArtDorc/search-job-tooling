name: Daily Job Search

# Runs the job-search pipeline on GitHub's runners (open network), emails the
# report to Arthur, and commits the report + dedup state back to the repo.
# Costs zero Claude tokens — this is the reliable daily engine.
#
# NOTE: GitHub only runs `schedule:` triggers from the repository's DEFAULT
# branch. Merge this workflow into the default branch for the daily cron to
# fire. Until then (and any time), run it manually via the "Run workflow"
# button (workflow_dispatch).

on:
  schedule:
    - cron: "30 6 * * *"   # 06:30 UTC daily (~08:30 Europe/Paris in summer)
  workflow_dispatch: {}

permissions:
  contents: write          # allow committing the report + state back

concurrency:
  group: daily-job-search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run job-search pipeline
        env:
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          # Email transport: set EITHER Resend OR the SMTP_* group as secrets.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: python -m jobsearch.run

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-search-report
          path: reports/
          if-no-files-found: ignore
          retention-days: 90

      - name: Commit report + dedup state
        run: |
          git config user.name  "job-search-bot"
          git config user.email "actions@github.com"
          git add reports state
          if git diff --cached --quiet; then
            echo "No new report or state change — nothing to commit."
          else
            git commit -m "Daily job search report ($(date -u +%Y-%m-%d)) [skip ci]"
            git push
          fi
